name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing version tag to publish, for example v0.1.0'
        required: true
        type: string
      prerelease:
        description: 'Mark the GitHub Release as a prerelease'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.version.outputs.tag_name }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout tags
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Resolve and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.version }}"
            prerelease="${{ inputs.prerelease }}"
          else
            tag="${GITHUB_REF_NAME}"
            prerelease="false"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v1.2.3 or v1.2.3-rc.1, got: $tag" >&2
            exit 1
          fi

          git fetch --force --tags
          if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Release tag does not exist: $tag" >&2
            exit 1
          fi

          echo "tag_name=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  test:
    name: Run release test gate
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ needs.validate.outputs.tag_name }}

      - name: Set up Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.25'

      - name: Run short tests
        run: GO_KV_LOG_LEVEL=warn go test -short ./... -count=1 -timeout=15m

  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs:
      - validate
      - test
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ''
          - goos: linux
            goarch: arm64
            ext: ''
          - goos: darwin
            goarch: amd64
            ext: ''
          - goos: darwin
            goarch: arm64
            ext: ''
          - goos: windows
            goarch: amd64
            ext: '.exe'

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ needs.validate.outputs.tag_name }}

      - name: Set up Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.25'

      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          target="${GOOS}-${GOARCH}"
          go build -trimpath -ldflags="-s -w" -o "dist/kv-server-${target}${{ matrix.ext }}" ./cmd/server
          go build -trimpath -ldflags="-s -w" -o "dist/kv-client-${target}${{ matrix.ext }}" ./cmd/client
          cd dist
          sha256sum "kv-server-${target}${{ matrix.ext }}" "kv-client-${target}${{ matrix.ext }}" > "go-kv-${target}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: go-kv-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - validate
      - build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate release checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          cd release-artifacts
          sha256sum kv-client-* kv-server-* > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag_name }}
          prerelease: ${{ needs.validate.outputs.prerelease }}
          files: release-artifacts/*
          generate_release_notes: true
